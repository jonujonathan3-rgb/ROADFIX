
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROADFIX | Admin Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid;
      place-items: center; padding: 20px;
      font-family: Arial, sans-serif; color: #fff;
      background: linear-gradient(135deg, #00152e, #073b70);
    }
    .login-card {
      width: 100%; max-width: 420px; padding: 36px;
      border-radius: 18px; background: #fff; color: #15263b;
      box-shadow: 0 20px 60px #0005;
    }
    .brand { color: #075ec9; font-size: 30px; font-weight: 800; }
    .accent { color: #e5a900; }
    h2 { margin-bottom: 8px; }
    .hint { color: #64748b; line-height: 1.5; }
    label { display: block; margin: 20px 0 8px; font-weight: 700; }
    input {
      width: 100%; padding: 13px; border: 1px solid #cbd5e1;
      border-radius: 8px; font-size: 16px;
    }
    button {
      width: 100%; margin-top: 24px; padding: 14px;
      border: 0; border-radius: 8px; background: #087cf2;
      color: white; font-size: 16px; font-weight: 700; cursor: pointer;
    }
    button:disabled { opacity: .65; cursor: wait; }
    #message { margin-top: 16px; line-height: 1.5; overflow-wrap: anywhere; }
    .back { display: block; margin-top: 22px; text-align: center; color: #075ec9; }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="brand">ROAD<span class="accent">FIX</span></div>
    <h2>Admin Login</h2>
    <p class="hint">Sign in to manage road complaints and maintenance.</p>

    <form id="loginForm">
      <label for="username">Admin username</label>
      <input id="username" name="username" autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password"
             autocomplete="current-password" required>

      <button id="loginButton" type="submit">Sign In</button>
      <p id="message" role="status"></p>
    </form>

    <a class="back" href="index.html">← Back to ROADFIX home</a>
  </main>

  <script>
    const API = "http://127.0.0.1:8000";
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "";
      button.disabled = true;

      try {
        const body = new URLSearchParams();
        body.set("username", document.getElementById("username").value.trim());
        body.set("password", document.getElementById("password").value);

        const response = await fetch(`${API}/api/auth/login`, {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded"
          },
          body: body.toString()
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.detail || "Login failed.");
        }

        sessionStorage.setItem("roadfix_admin_token", data.access_token);
        window.location.href = "admin_dashboard.html";
      } catch (error) {
        message.textContent =
          error.message === "Failed to fetch"
            ? "Cannot connect to the backend. Make sure FastAPI is running."
            : error.message;
        message.style.color = "#b91c1c";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
